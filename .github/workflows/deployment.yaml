name: Build and Deploy

on:
  workflow_call:
    inputs:
      runner:
        description: 'Escape-hatch override for runs-on. Leave empty (default) to auto-select the in-house ARC scale set for the target env (arc-shared-dev|stage|prod, derived from environment_name). Set to "ubuntu-latest" or a specific label only to opt a job out of ARC. A non-ARC runner gets none of the CI env.'
        required: false
        default: ""
        type: string
      environment_name:
        description: "Deployment environment (development, staging, production)"
        required: false
        default: "development"
        type: string
      service_name:
        description: "Service name (used in release tags and GCS paths)"
        required: true
        type: string
      image_path:
        description: "Image path within the registry (e.g. fleet-manager/fleet-manager)"
        required: false
        default: ""
        type: string
      deploy_type:
        description: "Deployment target: gke | build-only | release-only (anything else builds and pushes only)"
        required: false
        default: "gke"
        type: string
      deployment_name:
        description: "K8s deployment name for kubectl rollout restart (required if deploy_type=gke)"
        required: false
        default: ""
        type: string
      namespace:
        description: "K8s namespace (required if deploy_type=gke)"
        required: false
        default: ""
        type: string
      cloudrun_name:
        description: "Ignored. Cloud Run is gone; kept until no caller branch passes it, then remove"
        required: false
        default: ""
        type: string
      docker_context:
        description: "Docker build context path"
        required: false
        default: "."
        type: string
      dockerfile_path:
        description: "Path to the Dockerfile"
        required: false
        default: "Dockerfile"
        type: string
      generate_docs:
        description: "Run graphdoc generation and upload to GCS"
        required: false
        default: false
        type: boolean
      upload_release_files:
        description: "Upload release files (output-folder) to GCS without graphdoc (for release-only deployments)"
        required: false
        default: false
        type: boolean
      docs_script:
        description: "Path to Go documentation generation script"
        required: false
        default: "./scripts/generate-documentation.go"
        type: string
      docs_working_directory:
        description: "Working directory for docs generation steps (defaults to repo root; set to the service subdirectory for monorepo callers)"
        required: false
        default: "."
        type: string
      push_to_shared_registry:
        description: "Also push the image to the shared registry for the wanaware-operator"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Build, Publish, and Deploy
    # In-house ARC runners by default. The env comes from environment_name (which the caller
    # already derives from its branch: dev->development, stage->staging, prod->production), so a
    # merge to dev runs on wanaware-core-dev's cluster, stage on stage, prod on prod. `runner` is
    # an escape hatch: set it non-empty to force ubuntu-latest or a specific label for one caller.
    runs-on: >-
      ${{ inputs.runner != '' && inputs.runner
       || inputs.environment_name == 'production' && 'arc-shared-prod'
       || inputs.environment_name == 'staging' && 'arc-shared-stage'
       || 'arc-shared-dev' }}

    environment: ${{ inputs.environment_name }}

    # id-token: write is required for WIF — callers must also set this permission
    # in their own workflow, otherwise GitHub will not issue an OIDC token and
    # the Authenticate with GCP step will fail.
    permissions:
      contents: write
      id-token: write

    # build-push-action v6+ writes every build input (build-args included) to the job
    # summary and uploads a build-record artifact. GH_ACCESS_TOKEN is a build-arg and comes
    # from the runner's Keeper env rather than a GitHub secret, so nothing guarantees it is
    # masked there. Both features are off to keep the token out of summaries and artifacts.
    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate with GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Configure Docker to use the gcloud command-line tool as a credential helper
        if: ${{ inputs.deploy_type != 'release-only' }}
        run: gcloud auth configure-docker ${{ env.GCP_REGISTRY }}

      # This workflow no longer carries runtime env vars. There is no env-file
      # artifact, no GitHub-secret fan-out, and no `<service>-env` written from
      # CI. Keeper is the single source of truth for every runtime value, and it
      # reaches workloads without a pipeline:
      #
      #   Keeper -> External Secrets Operator -> Kubernetes Secret -> envFrom (GKE)
      #
      # That path lives in wanaware-infrastructure. CI plumbing (WIF identifiers,
      # registry host, GH_ACCESS_TOKEN) comes from the runner's Keeper-backed
      # ci-workload env; nothing is a GitHub secret.
      # ARC runners build through the pod's rootless BuildKit sidecar ($BUILDKIT_HOST):
      # no Docker daemon and nothing privileged. A non-ARC runner (the runner_label
      # escape hatch) has no sidecar and gets buildx's default driver instead.
      - name: Select the image builder
        if: ${{ inputs.deploy_type != 'release-only' }}
        id: builder
        run: |
          if [ -n "${BUILDKIT_HOST:-}" ]; then
            echo "driver=remote" >> "$GITHUB_OUTPUT"
            echo "endpoint=$BUILDKIT_HOST" >> "$GITHUB_OUTPUT"
          else
            echo "driver=docker-container" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up the image builder
        if: ${{ inputs.deploy_type != 'release-only' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ steps.builder.outputs.driver }}
          endpoint: ${{ steps.builder.outputs.endpoint }}

      # Built to a tarball rather than loaded into a daemon: Trivy scans the file, and
      # only a clean image is pushed (the push step rebuilds from the warm cache).
      - name: Build Docker image
        if: ${{ inputs.deploy_type != 'release-only' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.docker_context }}/${{ inputs.dockerfile_path }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: ${{ env.GCP_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ inputs.image_path }}:latest
          build-args: |
            GH_ACCESS_TOKEN=${{ env.GH_ACCESS_TOKEN }}
            GIT_SHA=${{ github.sha }}

      - name: Run Trivy vulnerability scanner on image
        if: ${{ inputs.deploy_type != 'release-only' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          input: ${{ runner.temp }}/image.tar
          version: "v0.76.2"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Push Docker image
        if: ${{ inputs.deploy_type != 'release-only' }}
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.docker_context }}/${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ env.GCP_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ inputs.image_path }}:latest
          build-args: |
            GH_ACCESS_TOKEN=${{ env.GH_ACCESS_TOKEN }}
            GIT_SHA=${{ github.sha }}

      # --- GKE deploy ---
      - name: Get GKE Credentials
        if: ${{ inputs.deploy_type == 'gke' }}
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_REGION }}
          project_id: ${{ env.GCP_PROJECT }}

      # No env Secret is written here. `<service_name>-env` is owned by External
      # Secrets Operator, which materialises it from Keeper on a 1m refresh
      # (wanaware-infrastructure: modules/external-secrets, service_secrets). The
      # Deployment consumes it via envFrom, so the rollout below is all CI needs
      # to do — the restarted pods pick up whatever Keeper currently holds.
      #
      # On a Threeport cluster (dev-01) the Core services (UAS, FI, SM, invoice-worker, NM,
      # DLQ, task-scheduler) are owned by the wanaware-operator in CORE_NAMESPACE, not by a
      # Deployment in their own namespace. There the image just pushed is pinned by digest on
      # the Core custom resource, and the operator rolls the Deployment. Everything else, and
      # every cluster without that Deployment's own namespace copy, keeps the restart.
      - name: Rollout restart (GKE)
        if: ${{ inputs.deploy_type == 'gke' }}
        env:
          DEPLOYMENT: ${{ inputs.deployment_name }}
          NAMESPACE: ${{ inputs.namespace }}
          IMAGE_PATH: ${{ inputs.image_path }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if kubectl get deployment "$DEPLOYMENT" -n "$NAMESPACE" >/dev/null 2>&1; then
            kubectl rollout restart "deployment/$DEPLOYMENT" -n "$NAMESPACE"
            exit 0
          fi

          CORE_NS="${CORE_NAMESPACE:-wanaware-core}"
          case "$DEPLOYMENT" in
            user-auth-deployment)                 FIELD='["userAuthentication"]' ;;
            function-integrator-deployment)       FIELD='["functionIntegrator"]' ;;
            subscription-manager-deployment)      FIELD='["subscriptionManager"]' ;;
            invoice-worker-deployment)            FIELD='["subscriptionManager","invoiceWorker"]' ;;
            notification-manager-deployment)      FIELD='["notificationManager"]' ;;
            dead-letter-queue-service-deployment) FIELD='["deadLetterQueueService"]' ;;
            task-scheduler-deployment)            FIELD='["taskScheduler"]' ;;
            *)                                    FIELD='' ;;
          esac
          if [ -z "$FIELD" ] || ! kubectl get core core -n "$CORE_NS" >/dev/null 2>&1; then
            echo "::error::deployment/$DEPLOYMENT not found in namespace $NAMESPACE, and it is not a Core service on this cluster"
            exit 1
          fi
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "::error::no image digest from the push step"
            exit 1
          fi

          IMAGE="$GCP_REGISTRY/$GCP_PROJECT/$IMAGE_PATH@$IMAGE_DIGEST"
          PATCH=$(jq -cn --argjson f "$FIELD" --arg img "$IMAGE" '{spec: ({} | setpath($f + ["image"]; $img))}')
          echo "Core service: setting $(echo "$FIELD" | jq -r 'join(".")').image on core/core in $CORE_NS to $IMAGE"
          kubectl patch core core -n "$CORE_NS" --type merge -p "$PATCH"

          # The operator updates the Deployment on its next reconcile; wait for it, then the rollout.
          for _ in $(seq 1 60); do
            CURRENT=$(kubectl get deployment "$DEPLOYMENT" -n "$CORE_NS" -o jsonpath='{.spec.template.spec.containers[*].image}')
            case " $CURRENT " in *" $IMAGE "*) break ;; esac
            sleep 5
          done
          case " $CURRENT " in
            *" $IMAGE "*) ;;
            *) echo "::error::the operator did not set $IMAGE on deployment/$DEPLOYMENT within 5 minutes"; exit 1 ;;
          esac
          kubectl rollout status "deployment/$DEPLOYMENT" -n "$CORE_NS" --timeout=10m

      # --- Optional: graphdoc generation ---
      - name: Set up Go for private modules
        if: ${{ inputs.generate_docs }}
        run: |
          git config --global url."https://$GH_ACCESS_TOKEN@github.com/".insteadOf "https://github.com/"

      - name: Install graphdoc
        if: ${{ inputs.generate_docs }}
        run: npm install -g --ignore-scripts @2fd/graphdoc@2.4.0

      - name: Generate documentation
        if: ${{ inputs.generate_docs }}
        run: go run ${{ inputs.docs_script }}
        working-directory: ${{ inputs.docs_working_directory }}
        env:
          GOPRIVATE: github.com/wanaware/*

      - name: Generate GraphQL docs
        if: ${{ inputs.generate_docs }}
        run: graphdoc -s ./generated-schema.graphql -o output-folder -f
        working-directory: ${{ inputs.docs_working_directory }}

      # --- GitHub release + GCS history ---
      - name: Mark deployment success
        id: deploy_status
        run: echo "success=true" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        if: steps.deploy_status.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force --prune --quiet
          sudo apt-get update && sudo apt-get install -y jq

          SHORTSHA=$(git rev-parse --short "$GITHUB_SHA")
          DATE=$(TZ=Asia/Karachi date +%Y.%m.%d.%H%M)

          if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            ENV="prod"
            ENV_NAME="production"
            IS_PRERELEASE="false"
          elif [[ "${{ github.ref }}" == "refs/heads/stage" ]]; then
            ENV="stage"
            ENV_NAME="staging"
            IS_PRERELEASE="true"
          else
            ENV="dev"
            ENV_NAME="development"
            IS_PRERELEASE="true"
          fi

          TAG="${ENV}-${DATE}-${SHORTSHA}"
          TITLE="[$ENV] $DATE"

          if git tag -l "$ENV-*-$SHORTSHA" | grep -q .; then
            echo "Release already exists for this commit, skipping."
          else
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              gh release create "$TAG" \
                --target ${{ github.ref_name }} \
                --title "$TITLE" \
                --generate-notes \
                --prerelease
            else
              gh release create "$TAG" \
                --target ${{ github.ref_name }} \
                --title "$TITLE" \
                --generate-notes
            fi
          fi

          RELEASE_NOTES=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.body' || echo "No release notes available")

          PR_DETAILS="[]"
          PR_NUMBERS=$(echo "$RELEASE_NOTES" | grep -oE '(#|pull/)[0-9]+' | grep -oE '[0-9]+' | sort -u || echo "")

          if [[ -n "$PR_NUMBERS" ]]; then
            PR_DETAILS="["
            FIRST=true
            for PR_NUM in $PR_NUMBERS; do
              PR_JSON=$(gh api repos/${{ github.repository }}/pulls/$PR_NUM --jq '{
                number: .number,
                title: .title,
                body: .body,
                user: .user.login
              }' 2>/dev/null || echo "")
              if [[ -n "$PR_JSON" ]]; then
                if [[ "$FIRST" == "true" ]]; then FIRST=false; else PR_DETAILS="${PR_DETAILS},"; fi
                PR_DETAILS="${PR_DETAILS}${PR_JSON}"
              fi
            done
            PR_DETAILS="${PR_DETAILS}]"
          fi

          echo "$PR_DETAILS" > pr-details.json

          # Export variables for the next step
          echo "DEPLOY_ENV=$ENV" >> $GITHUB_ENV
          echo "DEPLOY_TAG=$TAG" >> $GITHUB_ENV
          echo "DEPLOY_TITLE=$TITLE" >> $GITHUB_ENV
          echo "DEPLOY_ENV_NAME=$ENV_NAME" >> $GITHUB_ENV
          echo "DEPLOY_DATE=$DATE" >> $GITHUB_ENV
          echo "DEPLOY_RELEASE_NOTES<<EOFNOTES" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "EOFNOTES" >> $GITHUB_ENV

      - name: Update GCS release history
        if: steps.deploy_status.outputs.success == 'true'
        uses: WanAware/.github/.github/actions/gcs-history@prod
        with:
          bucket_name: ${{ env.BUCKET_NAME }}
          env: ${{ env.DEPLOY_ENV }}
          tag: ${{ env.DEPLOY_TAG }}
          title: ${{ env.DEPLOY_TITLE }}
          env_name: ${{ env.DEPLOY_ENV_NAME }}
          date: ${{ env.DEPLOY_DATE }}
          release_notes: ${{ env.DEPLOY_RELEASE_NOTES }}
          service_name: ${{ inputs.service_name }}

      - name: Upload docs to GCS
        if: ${{ inputs.generate_docs }}
        run: gcloud storage cp -r "$DOCS_WORKING_DIRECTORY"/output-folder/* gs://${{ env.BUCKET_NAME }}/${{ inputs.service_name }}
        env:
          DOCS_WORKING_DIRECTORY: ${{ inputs.docs_working_directory }}

      - name: Upload release files to GCS
        if: ${{ inputs.upload_release_files && !inputs.generate_docs }}
        run: gcloud storage cp -r output-folder/* gs://${{ env.BUCKET_NAME }}/${{ inputs.service_name }}/

  # Optional, best-effort push of the service image to the shared GCP project so
  # the wanaware-operator can pull and run it. Kept as a separate job calling a
  # separate workflow so it is fully isolated from the deploy job above: it runs
  # on its own runner, only ever authenticates to the shared project, and cannot
  # affect the deploy's gcloud credentials, its result, or its timing.
  #
  # Opt-in via push_to_shared_registry. `always()` means this runs even if the
  # deploy job fails, and no step here can fail the overall run (every step is
  # continue-on-error).
  push-to-shared-registry:
    name: Push Image to Shared Registry
    needs: deploy
    if: ${{ always() && inputs.push_to_shared_registry && inputs.deploy_type != 'release-only' }}
    uses: WanAware/.github/.github/workflows/shared-registry-push.yaml@prod
    permissions:
      contents: read
      id-token: write
    with:
      runner: ${{ inputs.runner }}
      environment_name: ${{ inputs.environment_name }}
      image_path: ${{ inputs.image_path }}
      docker_context: ${{ inputs.docker_context }}
      dockerfile_path: ${{ inputs.dockerfile_path }}
