name: Build and Deploy

on:
  workflow_call:
    inputs:
      runner:
        description: 'Escape-hatch override for runs-on. Leave empty (default) to auto-select the in-house ARC scale set for the target env (arc-shared-dev|stage|prod, derived from environment_name). Set to "ubuntu-latest" or a specific label only to opt a job out of ARC.'
        required: false
        default: ""
        type: string
      environment_name:
        description: "Deployment environment (development, staging, production)"
        required: false
        default: "development"
        type: string
      service_name:
        description: "Service name (used in release tags and GCS paths)"
        required: true
        type: string
      image_path:
        description: "Image path within the registry (e.g. fleet-manager/fleet-manager)"
        required: false
        default: ""
        type: string
      deploy_type:
        description: "Deployment target: gke | cloudrun-service | cloudrun-job | build-only | release-only"
        required: false
        default: "gke"
        type: string
      deployment_name:
        description: "K8s deployment name for kubectl rollout restart (required if deploy_type=gke)"
        required: false
        default: ""
        type: string
      namespace:
        description: "K8s namespace (required if deploy_type=gke)"
        required: false
        default: ""
        type: string
      cloudrun_name:
        description: "Cloud Run service or job name (required if deploy_type != gke)"
        required: false
        default: ""
        type: string
      docker_context:
        description: "Docker build context path"
        required: false
        default: "."
        type: string
      dockerfile_path:
        description: "Path to the Dockerfile"
        required: false
        default: "Dockerfile"
        type: string
      generate_docs:
        description: "Run graphdoc generation and upload to GCS"
        required: false
        default: false
        type: boolean
      upload_release_files:
        description: "Upload release files (output-folder) to GCS without graphdoc (for release-only deployments)"
        required: false
        default: false
        type: boolean
      docs_script:
        description: "Path to Go documentation generation script"
        required: false
        default: "./scripts/generate-documentation.go"
        type: string
      docs_working_directory:
        description: "Working directory for docs generation steps (defaults to repo root; set to the service subdirectory for monorepo callers)"
        required: false
        default: "."
        type: string
    secrets:
      GCP_SERVICE_ACCOUNT:
        required: true
        description: "GCP service account email to impersonate via WIF (e.g. tf-deploy@my-project.iam.gserviceaccount.com)."
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: true
        description: "Full WIF provider resource name (e.g. projects/123/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider)."
      GCP_PROJECT:
        required: false
      GCP_REGISTRY:
        required: false
      GH_ACCESS_TOKEN:
        required: false
      CLUSTER_NAME:
        required: false
      CLUSTER_REGION:
        required: false
      BUCKET_NAME:
        required: false

      # Secrets for the optional shared-registry push (see the
      # push-to-shared-registry job below). All optional: when they are not set
      # the shared push is skipped and nothing else changes.
      GCP_SERVICE_ACCOUNT_SHARED:
        required: false
        description: "Shared-project GCP service account email to impersonate via WIF."
      GCP_WORKLOAD_IDENTITY_PROVIDER_SHARED:
        required: false
        description: "Full WIF provider resource name for the shared project."
      GCP_PROJECT_SHARED:
        required: false
        description: "Shared GCP project ID that receives the image."
      GCP_REGISTRY_SHARED:
        required: false
        description: "Shared Artifact Registry host (e.g. us-central1-docker.pkg.dev)."

jobs:
  deploy:
    name: Build, Publish, and Deploy
    # In-house ARC runners by default. The env comes from environment_name (which the caller
    # already derives from its branch: dev->development, stage->staging, prod->production), so a
    # merge to dev runs on wanaware-core-dev's cluster, stage on stage, prod on prod. `runner` is
    # an escape hatch: set it non-empty to force ubuntu-latest or a specific label for one caller.
    runs-on: >-
      ${{ inputs.runner != '' && inputs.runner
       || inputs.environment_name == 'production' && 'arc-shared-prod'
       || inputs.environment_name == 'staging' && 'arc-shared-stage'
       || 'arc-shared-dev' }}

    environment: ${{ inputs.environment_name }}

    # id-token: write is required for WIF — callers must also set this permission
    # in their own workflow, otherwise GitHub will not issue an OIDC token and
    # the Authenticate with GCP step will fail.
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Configure Docker to use the gcloud command-line tool as a credential helper
        if: ${{ inputs.deploy_type != 'release-only' }}
        run: gcloud auth configure-docker ${{ secrets.GCP_REGISTRY }}

      # This workflow no longer carries runtime env vars. There is no env-file
      # artifact, no GitHub-secret fan-out, and no `<service>-env` written from
      # CI. Keeper is the single source of truth for every runtime value, and it
      # reaches workloads without a pipeline:
      #
      #   Keeper -> External Secrets Operator -> Kubernetes Secret -> envFrom (GKE)
      #   Keeper -> External Secrets Operator -> Kubernetes Secret -> terraform
      #             apply (modules/cloudrun-env-sync) -> Cloud Run env
      #
      # Both legs live in wanaware-infrastructure. What stays a GitHub secret is
      # CI plumbing only — WIF identifiers, registry host, GH_ACCESS_TOKEN — none
      # of which is application configuration.
      - name: Build Docker image
        if: ${{ inputs.deploy_type != 'release-only' }}
        id: build
        uses: docker/build-push-action@v4
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.docker_context }}/${{ inputs.dockerfile_path }}
          push: false
          load: true
          tags: ${{ secrets.GCP_REGISTRY }}/${{ secrets.GCP_PROJECT }}/${{ inputs.image_path }}:latest
          build-args: |
            GH_ACCESS_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}

      - name: Run Trivy vulnerability scanner on image
        if: ${{ inputs.deploy_type != 'release-only' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: ${{ secrets.GCP_REGISTRY }}/${{ secrets.GCP_PROJECT }}/${{ inputs.image_path }}:latest
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Push Docker image
        if: ${{ inputs.deploy_type != 'release-only' }}
        run: docker push ${{ secrets.GCP_REGISTRY }}/${{ secrets.GCP_PROJECT }}/${{ inputs.image_path }}:latest

      # --- GKE deploy ---
      - name: Get GKE Credentials
        if: ${{ inputs.deploy_type == 'gke' }}
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.CLUSTER_NAME }}
          location: ${{ secrets.CLUSTER_REGION }}
          project_id: ${{ secrets.GCP_PROJECT }}

      # No env Secret is written here. `<service_name>-env` is owned by External
      # Secrets Operator, which materialises it from Keeper on a 1m refresh
      # (wanaware-infrastructure: modules/external-secrets, service_secrets). The
      # Deployment consumes it via envFrom, so the rollout below is all CI needs
      # to do — the restarted pods pick up whatever Keeper currently holds.
      - name: Rollout restart (GKE)
        if: ${{ inputs.deploy_type == 'gke' }}
        run: kubectl rollout restart deployment/${{ inputs.deployment_name }} -n ${{ inputs.namespace }}

      # --- Cloud Run deploys ---
      # Deliberately image-only: no --env-vars-file, ever. Cloud Run env vars are
      # synced from the Keeper-backed Kubernetes Secret at terraform apply time
      # (wanaware-infrastructure: modules/cloudrun-env-sync). `gcloud run deploy`
      # and `gcloud run jobs update` preserve the env already on the resource when
      # the flag is absent, so an image bump here never blanks it — whereas
      # passing --env-vars-file replaces the whole environment, which is exactly
      # the failure mode this removal prevents.
      - name: Deploy Cloud Run service
        if: ${{ inputs.deploy_type == 'cloudrun-service' }}
        run: |
          gcloud run deploy ${{ inputs.cloudrun_name }} \
            --image ${{ secrets.GCP_REGISTRY }}/${{ secrets.GCP_PROJECT }}/${{ inputs.image_path }}:latest \
            --region ${{ secrets.CLUSTER_REGION }} \
            --project ${{ secrets.GCP_PROJECT }}

      - name: Deploy Cloud Run job
        if: ${{ inputs.deploy_type == 'cloudrun-job' }}
        run: |
          gcloud run jobs update ${{ inputs.cloudrun_name }} \
            --image ${{ secrets.GCP_REGISTRY }}/${{ secrets.GCP_PROJECT }}/${{ inputs.image_path }}:latest \
            --region ${{ secrets.CLUSTER_REGION }} \
            --project ${{ secrets.GCP_PROJECT }}

      # --- Optional: graphdoc generation ---
      - name: Set up Go for private modules
        if: ${{ inputs.generate_docs }}
        run: |
          git config --global url."https://$GH_ACCESS_TOKEN@github.com/".insteadOf "https://github.com/"
        env:
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Install graphdoc
        if: ${{ inputs.generate_docs }}
        run: npm install -g @2fd/graphdoc

      - name: Generate documentation
        if: ${{ inputs.generate_docs }}
        run: go run ${{ inputs.docs_script }}
        working-directory: ${{ inputs.docs_working_directory }}
        env:
          GOPRIVATE: github.com/wanaware/*

      - name: Generate GraphQL docs
        if: ${{ inputs.generate_docs }}
        run: graphdoc -s ./generated-schema.graphql -o output-folder -f
        working-directory: ${{ inputs.docs_working_directory }}

      # --- GitHub release + GCS history ---
      - name: Mark deployment success
        id: deploy_status
        run: echo "success=true" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        if: steps.deploy_status.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force --prune --quiet
          sudo apt-get update && sudo apt-get install -y jq

          SHORTSHA=$(git rev-parse --short "$GITHUB_SHA")
          DATE=$(TZ=Asia/Karachi date +%Y.%m.%d.%H%M)

          if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            ENV="prod"
            ENV_NAME="production"
            IS_PRERELEASE="false"
          elif [[ "${{ github.ref }}" == "refs/heads/stage" ]]; then
            ENV="stage"
            ENV_NAME="staging"
            IS_PRERELEASE="true"
          else
            ENV="dev"
            ENV_NAME="development"
            IS_PRERELEASE="true"
          fi

          TAG="${ENV}-${DATE}-${SHORTSHA}"
          TITLE="[$ENV] $DATE"

          if git tag -l "$ENV-*-$SHORTSHA" | grep -q .; then
            echo "Release already exists for this commit, skipping."
          else
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              gh release create "$TAG" \
                --target ${{ github.ref_name }} \
                --title "$TITLE" \
                --generate-notes \
                --prerelease
            else
              gh release create "$TAG" \
                --target ${{ github.ref_name }} \
                --title "$TITLE" \
                --generate-notes
            fi
          fi

          RELEASE_NOTES=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.body' || echo "No release notes available")

          PR_DETAILS="[]"
          PR_NUMBERS=$(echo "$RELEASE_NOTES" | grep -oE '(#|pull/)[0-9]+' | grep -oE '[0-9]+' | sort -u || echo "")

          if [[ -n "$PR_NUMBERS" ]]; then
            PR_DETAILS="["
            FIRST=true
            for PR_NUM in $PR_NUMBERS; do
              PR_JSON=$(gh api repos/${{ github.repository }}/pulls/$PR_NUM --jq '{
                number: .number,
                title: .title,
                body: .body,
                user: .user.login
              }' 2>/dev/null || echo "")
              if [[ -n "$PR_JSON" ]]; then
                if [[ "$FIRST" == "true" ]]; then FIRST=false; else PR_DETAILS="${PR_DETAILS},"; fi
                PR_DETAILS="${PR_DETAILS}${PR_JSON}"
              fi
            done
            PR_DETAILS="${PR_DETAILS}]"
          fi

          echo "$PR_DETAILS" > pr-details.json

          # Export variables for the next step
          echo "DEPLOY_ENV=$ENV" >> $GITHUB_ENV
          echo "DEPLOY_TAG=$TAG" >> $GITHUB_ENV
          echo "DEPLOY_TITLE=$TITLE" >> $GITHUB_ENV
          echo "DEPLOY_ENV_NAME=$ENV_NAME" >> $GITHUB_ENV
          echo "DEPLOY_DATE=$DATE" >> $GITHUB_ENV
          echo "DEPLOY_RELEASE_NOTES<<EOFNOTES" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "EOFNOTES" >> $GITHUB_ENV

      - name: Update GCS release history
        if: steps.deploy_status.outputs.success == 'true'
        uses: WanAware/.github/.github/actions/gcs-history@prod
        with:
          bucket_name: ${{ secrets.BUCKET_NAME }}
          env: ${{ env.DEPLOY_ENV }}
          tag: ${{ env.DEPLOY_TAG }}
          title: ${{ env.DEPLOY_TITLE }}
          env_name: ${{ env.DEPLOY_ENV_NAME }}
          date: ${{ env.DEPLOY_DATE }}
          release_notes: ${{ env.DEPLOY_RELEASE_NOTES }}
          service_name: ${{ inputs.service_name }}

      - name: Upload docs to GCS
        if: ${{ inputs.generate_docs }}
        run: gcloud storage cp -r "$DOCS_WORKING_DIRECTORY"/output-folder/* gs://${{ secrets.BUCKET_NAME }}/${{ inputs.service_name }}
        env:
          DOCS_WORKING_DIRECTORY: ${{ inputs.docs_working_directory }}

      - name: Upload release files to GCS
        if: ${{ inputs.upload_release_files && !inputs.generate_docs }}
        run: gcloud storage cp -r output-folder/* gs://${{ secrets.BUCKET_NAME }}/${{ inputs.service_name }}/

  # Optional, best-effort push of the service image to the shared GCP project so
  # the wanaware-operator can pull and run it. Kept as a separate job calling a
  # separate workflow so it is fully isolated from the deploy job above: it runs
  # on its own runner, only ever authenticates to the shared project, and cannot
  # affect the deploy's gcloud credentials, its result, or its timing.
  #
  # `always()` means this runs even if the deploy job fails, and no step here
  # can fail the overall run (every step is continue-on-error, and the called
  # workflow skips cleanly when the shared secrets are absent). Callers do not
  # need any changes: the shared push activates purely by setting the four
  # GCP_*_SHARED secrets on the repo.
  push-to-shared-registry:
    name: Push Image to Shared Registry
    needs: deploy
    if: ${{ always() && inputs.deploy_type != 'release-only' }}
    uses: WanAware/.github/.github/workflows/shared-registry-push.yaml@prod
    permissions:
      contents: read
      id-token: write
    with:
      runner: ${{ inputs.runner }}
      environment_name: ${{ inputs.environment_name }}
      image_path: ${{ inputs.image_path }}
      docker_context: ${{ inputs.docker_context }}
      dockerfile_path: ${{ inputs.dockerfile_path }}
    secrets:
      GCP_SERVICE_ACCOUNT_SHARED: ${{ secrets.GCP_SERVICE_ACCOUNT_SHARED }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_SHARED: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_SHARED }}
      GCP_PROJECT_SHARED: ${{ secrets.GCP_PROJECT_SHARED }}
      GCP_REGISTRY_SHARED: ${{ secrets.GCP_REGISTRY_SHARED }}
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
