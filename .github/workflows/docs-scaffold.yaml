name: Documentation Scaffold

# Reusable workflow that deploys the WanAware standard documentation set (the docs kit in
# .github/actions/docs-kit) into the calling repository and opens a pull request with it:
#
#   - docs/templates/: the templates, the checker (docs_kit.py) and docs-kit.json (the repository's
#     settings: layout, name, services directory, branch named in metadata lines);
#   - every missing standard document, rendered from the templates (docs/, and
#     <services>/<service>/docs/ in a monorepo), plus docs/10-documentation-standards.md.
#
# Existing documents are never overwritten. With refresh: true, the kit-managed files
# (docs/templates/ and docs/10-documentation-standards.md) are replaced with the current kit, so a
# change to the standard reaches the repository as a reviewable pull request.
#
# Callers (see workflow-templates/documentation.yml):
#
#   jobs:
#     scaffold:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: wanaware/.github/.github/workflows/docs-scaffold.yaml@prod
#
# Pull requests opened with the default GITHUB_TOKEN do not trigger other workflows, so the
# documentation check runs on the pull request only after a later push (or close and reopen).
# Pass a token secret (a GitHub App or bot token with contents and pull-requests write) to avoid that.

on:
  workflow_call:
    inputs:
      runner:
        description: "Escape-hatch override for runs-on. Leave empty (default) to run on the in-house dev ARC scale set (arc-shared-dev)."
        required: false
        default: ""
        type: string
      layout:
        description: "single (one documentation set in docs/), monorepo (docs/ plus one set per service directory) or auto. Empty keeps the repository's setting, or detects it on the first run (monorepo when the services directory has two or more subdirectories)."
        required: false
        default: ""
        type: string
      name:
        description: "Name used in repository-level document titles, for example 'Asset Pipeline'. Empty keeps the setting, or uses the repository name."
        required: false
        default: ""
        type: string
      components_dir:
        description: "Monorepo directory with one subdirectory per service. Empty keeps the setting, or uses services."
        required: false
        default: ""
        type: string
      branch:
        description: "Branch named in the 'Last verified against source' metadata lines. Empty keeps the setting, or uses dev."
        required: false
        default: ""
        type: string
      refresh:
        description: "Also replace the kit-managed files (docs/templates/ and docs/10-documentation-standards.md) with the current kit."
        required: false
        default: false
        type: boolean
      base:
        description: "Branch the pull request targets. Empty uses the branch the workflow runs on."
        required: false
        default: ""
        type: string
      pr_branch:
        description: "Branch the scaffold is committed to. An existing branch with unmerged commits is continued, not replaced."
        required: false
        default: "chore/standard-docs"
        type: string
      python_version:
        description: "Python version for the docs kit"
        required: false
        default: "3.14"
        type: string
    secrets:
      token:
        description: "Token used to push and open the pull request. Defaults to GITHUB_TOKEN."
        required: false

permissions:
  contents: read

jobs:
  scaffold:
    name: Scaffold standard documentation
    runs-on: ${{ inputs.runner != '' && inputs.runner || 'arc-shared-dev' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: docs-scaffold-${{ github.repository }}
      cancel-in-progress: false
    env:
      BASE: ${{ inputs.base != '' && inputs.base || github.ref_name }}
      PR_BRANCH: ${{ inputs.pr_branch }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}

      - name: Prepare the scaffold branch
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD)
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          if git fetch --quiet origin "refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH" 2>/dev/null \
              && ! git merge-base --is-ancestor "origin/$PR_BRANCH" HEAD; then
            echo "Continuing the unmerged branch $PR_BRANCH, updated with $BASE."
            git checkout -B "$PR_BRANCH" "origin/$PR_BRANCH"
            # Bring in what BASE gained since the branch was made (a new service, say) so the
            # scaffold sees it, keeping the documentation already written on the branch.
            if ! git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                merge --no-edit -m "Merge $BASE into $PR_BRANCH" "$base_sha"; then
              git merge --abort
              echo "::error title=Scaffold branch conflicts::$PR_BRANCH conflicts with $BASE. Merge $BASE into it (or delete the branch), then run the workflow again."
              exit 1
            fi
          else
            echo "Starting $PR_BRANCH from $BASE."
            git checkout -B "$PR_BRANCH"
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Scaffold documentation
        uses: wanaware/.github/.github/actions/docs-kit@prod
        with:
          command: scaffold
          layout: ${{ inputs.layout }}
          name: ${{ inputs.name }}
          components_dir: ${{ inputs.components_dir }}
          branch: ${{ inputs.branch }}
          refresh: ${{ inputs.refresh }}
          summary_file: ${{ runner.temp }}/docs-scaffold.md

      - name: Commit, push and open the pull request
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          set -euo pipefail
          # Stage only documentation: docs/ and, in a monorepo, each service's docs/.
          git add -A -- docs
          layout=$(python3 -c 'import json; print(json.load(open("docs/templates/docs-kit.json"))["layout"])')
          if [ "$layout" = "monorepo" ]; then
            components=$(python3 -c 'import json; print(json.load(open("docs/templates/docs-kit.json"))["components_dir"])')
            # grep exits 1 when no service documentation changed (for example a refresh that only
            # touches docs/); that is not an error, but pipefail would end the step on it.
            git ls-files -z --others --modified --exclude-standard -- "$components" \
              | { grep -z '/docs/' || [ $? -eq 1 ]; } | xargs -0 -r git add --
          fi
          if [ "$REFRESH" = "true" ]; then
            title="chore: refresh the standard documentation kit from wanaware/.github"
          else
            title="chore: add the standard documentation set from the docs kit"
          fi
          if git diff --cached --quiet; then
            echo "No new documentation changes to commit."
          else
            git diff --cached --stat
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit --quiet -m "$title" -m "Generated by the docs kit in wanaware/.github (.github/actions/docs-kit)."
          fi

          # Nothing to propose when the branch adds nothing to BASE. Otherwise push what the remote
          # branch lacks, then make sure a pull request is open: an earlier run may have pushed the
          # branch but failed to open it.
          if [ "$(git rev-list --count "$BASE_SHA..HEAD")" -eq 0 ]; then
            echo "The documentation is already up to date."
            echo "The documentation is already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          remote_sha=$(git rev-parse -q --verify "refs/remotes/origin/$PR_BRANCH" || true)
          if [ "$remote_sha" != "$(git rev-parse HEAD)" ]; then
            git push --force-with-lease="$PR_BRANCH" origin "HEAD:refs/heads/$PR_BRANCH"
          fi

          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "## Summary"
            echo
            echo "Deploys the WanAware standard documentation set from the docs kit in [\`wanaware/.github\`](https://github.com/wanaware/.github/tree/prod/.github/actions/docs-kit). Existing documents are kept as they are."
            echo
            cat "$RUNNER_TEMP/docs-scaffold.md"
            echo
            echo "## Why"
            echo
            echo "Every WanAware repository documents itself with the same set of documents, titles and numbered sections, so a reader who knows one repository's documentation can find their way around any other. The rules are in \`docs/10-documentation-standards.md\`."
            echo
            echo "### Next steps"
            echo
            echo "1. Fill in each created document from the code: replace every \`<placeholder>\`, delete the guidance comments, and set the \"Last verified against source\" date and commit."
            echo "2. Run \`python3 docs/templates/docs_kit.py check\` until it passes (\`--allow-placeholders\` shows the structure problems alone)."
            echo "3. Link \`docs/README.md\` from the repository README (and, in a monorepo, from each service's README)."
            echo
            echo "## QA Report"
            echo
            echo "- [x] No QA report required"
            echo
            echo "## Integration Tests"
            echo
            echo "- [x] No integration tests required"
          } > "$body"

          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          if ! pulls=$(curl -fsS "${auth[@]}" "$api/pulls?state=open&base=$BASE&head=$GITHUB_REPOSITORY_OWNER:$PR_BRANCH"); then
            echo "::error title=Pull request not checked::Pushed $PR_BRANCH but could not list its pull requests; check the token's pull-requests permission"
            exit 1
          fi
          existing=$(printf '%s' "$pulls" | python3 -c 'import json, sys; prs = json.load(sys.stdin); print(prs[0]["html_url"] if prs else "")')
          if [ -n "$existing" ]; then
            echo "The pull request is open: $existing"
            echo "The pull request is open: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -c 'import json, sys; print(json.dumps({"title": sys.argv[1], "head": sys.argv[2], "base": sys.argv[3], "body": open(sys.argv[4]).read()}))' \
            "$title" "$PR_BRANCH" "$BASE" "$body" > "$RUNNER_TEMP/pr.json"
          if created=$(curl -fsS "${auth[@]}" -X POST "$api/pulls" --data @"$RUNNER_TEMP/pr.json"); then
            url=$(printf '%s' "$created" | python3 -c 'import json, sys; print(json.load(sys.stdin)["html_url"])')
            echo "Opened $url"
            echo "Opened the pull request: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$PR_BRANCH?expand=1"
            echo "::warning title=Pull request not opened::Pushed $PR_BRANCH but could not open the pull request (the organization may not allow GitHub Actions to create pull requests). Open it from $compare"
            echo "Pushed \`$PR_BRANCH\`; open the pull request from $compare" >> "$GITHUB_STEP_SUMMARY"
          fi
