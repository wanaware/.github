name: Integration Tests

on:
  workflow_call:
    inputs:
      runner:
        description: "Escape-hatch override for runs-on. Leave empty (default) to run on the in-house dev ARC scale set (arc-shared-dev) — integration tests always run against the dev tier (environment: development, PRs to dev). Set to 'ubuntu-latest' or a specific label only to opt out of ARC."
        required: false
        default: ""
        type: string
      go_version:
        description: "Go version to use"
        required: false
        default: "1.24.6"
        type: string
      server_cmd:
        description: "Go main file to run the server (e.g. ./cmd/fleet-manager/main.go). Not required when using multi_service."
        required: false
        default: ""
        type: string
      wait_for_it_path:
        description: "Path to wait-for-it.sh script"
        required: false
        default: "./scripts/wait-for-it.sh"
        type: string
      postman_collection:
        description: "Path to the Postman collection JSON file (required if not using test_runner_script)"
        required: false
        default: ""
        type: string
      newman_extra_args:
        description: "Extra args to pass to newman (e.g. --delay-request 500)"
        required: false
        default: ""
        type: string
      use_redis:
        description: "Start a local Redis instance"
        required: false
        default: true
        type: boolean
      use_nats:
        description: "Start a local NATS server instance"
        required: false
        default: false
        type: boolean
      use_nats_jetstream:
        description: "Enable JetStream on the local NATS server (requires use_nats=true). Adds -js flag so streams and consumers can be created locally."
        required: false
        default: false
        type: boolean
      use_nats_port_forward:
        description: "Port-forward to in-cluster NATS service (requires GKE credentials). Use instead of use_nats when cluster NATS state is needed."
        required: false
        default: false
        type: boolean
      use_cloud_sql:
        description: "Start Cloud SQL Proxy and connect to the DB"
        required: false
        default: true
        type: boolean
      use_vault:
        description: "Mint a ServiceAccount token so the service under test can authenticate to the in-cluster Vault. Requires GKE credentials. Sets VAULT_CACERT and VAULT_TOKEN_PATH; the caller still supplies VAULT_ADDR and VAULT_ROLE."
        required: false
        default: false
        type: boolean
      vault_ksa:
        description: "ServiceAccount to mint the Vault login token as (e.g. user-authentication-service-ksa). Required when use_vault=true."
        required: false
        default: ""
        type: string
      vault_ksa_namespace:
        description: "Namespace of vault_ksa. Defaults to vault_ksa with the -ksa suffix stripped, which matches the repo-wide <service>/<service>-ksa convention."
        required: false
        default: ""
        type: string
      server_env:
        description: "Multiline env vars to export before starting the Go server (KEY=VALUE format). Use it for values that are specific to the test rig (local sidecar hosts and ports, ENVIRONMENT=IntegrationTest), never for secrets — those arrive from Keeper in the runner environment."
        required: false
        default: ""
        type: string
      access_token_script:
        description: "Path to Python script that fetches access tokens"
        required: false
        default: "./scripts/get_access_token.py"
        type: string
      skip_access_token:
        description: "Skip the access token fetching step entirely"
        required: false
        default: false
        type: boolean
      newman_env_json:
        description: "JSON string for Newman environment variables (injected into newman_env.json)"
        required: false
        default: ""
        type: string
      cleanup_script:
        description: "Path to cleanup script to run before tests (e.g. ./shell_scripts/cleanup-test-data.sh)"
        required: false
        default: ""
        type: string
      pre_test_setup_script:
        description: "Path to Python script for pre-test setup (e.g. ./shell_scripts/create_and_capture_ids.py)"
        required: false
        default: ""
        type: string
      delete_data_tags_script:
        description: "Path to Python script to delete data tags before tests (e.g. ./shell_scripts/delete_data_tags.py)"
        required: false
        default: ""
        type: string
      test_runner_script:
        description: "Path to custom test runner script instead of direct newman (e.g. ./shell_scripts/run-all-api-tests.sh)"
        required: false
        default: ""
        type: string
      post_test_cleanup_script:
        description: "Path to Python script for post-test cleanup (e.g. ./shell_scripts/delete_nodes.py)"
        required: false
        default: ""
        type: string
      post_test_cleanup_args:
        description: "Arguments for post-test cleanup script (e.g. Function for node type)"
        required: false
        default: ""
        type: string
      working_directory:
        description: "Directory containing go.mod (for monorepos). Defaults to repo root. When set, relative paths such as server_cmd are resolved from this directory."
        required: false
        default: "."
        type: string
      ci_app_runtime_sa_email:
        description: "GCP service account email for WIF auth (IAM signing, GCS, etc.). Each service has its own SA. Falls back to secrets.CI_APP_RUNTIME_SA_EMAIL if not provided."
        required: false
        default: ""
        type: string
      multi_service:
        description: "Path to a script that builds and starts multiple services (e.g. ./integration-tests/scripts/start-services.sh). When set, replaces single-server build/start. PIDs must be written to /tmp/service-pids.txt for cleanup."
        required: false
        default: ""
        type: string

jobs:
  integration-test:
    name: Run Integration Tests
    # In-house ARC by default; integration tests always target the dev tier (arc-shared-dev).
    # `runner` is an escape hatch (set non-empty to force ubuntu-latest / a specific label).
    runs-on: ${{ inputs.runner != '' && inputs.runner || 'arc-shared-dev' }}
    environment: development
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Runtime values are already in this job's environment. The ARC runner image's
      # job-started hook resolves this repo to its own <svc>-env Secret — materialised
      # from Keeper by External Secrets Operator — and exports it before the first step
      # runs. Nothing is declared here: a repo gets its env by virtue of being that repo,
      # so rotating a value in Keeper needs no change in any repo or in this file.
      # See wanaware-infrastructure: docker/arc-runner/hooks/load-service-env.sh.
      #
      # Two consequences worth knowing when editing the steps below:
      #   * The hook writes to $GITHUB_ENV, so values arrive as `${{ env.DB_USER }}` AND
      #     as $DB_USER in `run:` shells. Both work; earlier revisions of this file were
      #     shell-only because the values came from envFrom instead.
      #   * A step-level `env:` block overrides the inherited value. Listing a key
      #     there with an empty expression blanks it; omit the key instead.
      #
      # No per-repo list of names to maintain: the service's Keeper record is the source
      # of truth for WHAT it receives, so enumerating it here would just be a second copy.
      #
      # This checks only the handful the workflow needs to build its OWN plumbing,
      # derived from the use_* inputs. Those are the ones that fail misleadingly:
      # an empty DB_PORT is not an error, it is a tunnel to the wrong port that
      # surfaces much later as a connection refused looking like a network fault.
      #
      # A service's own config is deliberately NOT checked. Missing keys there
      # panic the server on startup naming the key, which is already a clear
      # failure that points at the right place.
      - name: Verify test rig env
        env:
          NEEDS_DB: ${{ inputs.use_cloud_sql }}
          # Only the port-forward path reads NATS_PORT. The local-sidecar path
          # (use_nats) binds 4222 itself and never looks at it, so requiring it there
          # fails a job over a value nothing reads.
          NEEDS_NATS: ${{ inputs.use_nats_port_forward }}
        run: |
          set -euo pipefail
          MISSING=()
          if [[ "$NEEDS_DB" == "true" ]]; then
            for KEY in DB_PORT DB_USER DB_NAME DB_PASSWORD; do
              if [[ -z "${!KEY:-}" ]]; then MISSING+=("$KEY"); fi
            done
          fi
          if [[ "$NEEDS_NATS" == "true" ]]; then
            if [[ -z "${NATS_PORT:-}" ]]; then MISSING+=("NATS_PORT"); fi
          fi
          if ((${#MISSING[@]})); then
            echo "::error::Missing from the service env: ${MISSING[*]}"
            echo "::error::These build the test rig itself, so an empty value misroutes instead of erroring."
            echo "::error::The runner hook resolves this repo to a <svc>-env Secret; check that it exists"
            echo "::error::and holds these keys, and that any override in the service-env-map ConfigMap is right."
            exit 1
          fi
          echo "Test rig env present."

      # NATS client auth takes an nkey seed from a *file*, but the value arrives
      # from Keeper as an env var. Write it to the path callers already point
      # NATS_NKEY_SEED_FILE at, so no artifact has to carry a credential.
      - name: Materialise NATS nkey seed file
        if: ${{ inputs.use_nats || inputs.use_nats_port_forward }}
        run: |
          set -euo pipefail
          if [[ -z "${NATS_NKEY_SEED:-}" ]]; then
            echo "NATS_NKEY_SEED not in the service env; skipping seed file."
            exit 0
          fi
          umask 077
          printf '%s' "$NATS_NKEY_SEED" > ./nats-nkey.seed
          echo "NATS_NKEY_SEED_FILE=./nats-nkey.seed" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ inputs.go_version }}

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      # --- Optional: Redis ---
      - name: Start Local Redis Instance
        if: ${{ inputs.use_redis }}
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools
          sudo systemctl stop redis-server || true
          cat > redis.conf << EOF
          port 6379
          daemonize yes
          requirepass dummy_password_for_local_redis
          bind 127.0.0.1
          save ""
          appendonly no
          EOF
          redis-server redis.conf
          sleep 5
          redis-cli -h 127.0.0.1 -p 6379 -a "dummy_password_for_local_redis" ping

      - name: Ping Local Redis
        if: ${{ inputs.use_redis }}
        run: redis-cli -h 127.0.0.1 -p 6379 -a "dummy_password_for_local_redis" PING

      # --- Optional: NATS ---
      - name: Start Local NATS Server
        if: ${{ inputs.use_nats }}
        run: |
          NATS_VERSION="v2.10.18"
          sudo apt-get install -y unzip
          curl -sSfL \
            "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.zip" \
            -o nats-server.zip
          unzip -o nats-server.zip
          chmod +x nats-server-${NATS_VERSION}-linux-amd64/nats-server
          sudo mv nats-server-${NATS_VERSION}-linux-amd64/nats-server /usr/local/bin/nats-server
          JS_FLAGS=""
          if [[ "${{ inputs.use_nats_jetstream }}" == "true" ]]; then
            JS_FLAGS="-js -sd /tmp/nats-jetstream"
            echo "Enabling JetStream on local NATS server"
          fi
          nohup nats-server --port 4222 --http_port 8222 $JS_FLAGS > nats-server.log 2>&1 &
          echo "NATS_SERVER_PID=$!" >> $GITHUB_ENV
          sleep 2
          echo "NATS_URL=nats://127.0.0.1:4222" >> $GITHUB_ENV

      - name: Ping Local NATS
        if: ${{ inputs.use_nats }}
        run: |
          curl --fail --silent --retry 5 --retry-delay 1 \
            http://127.0.0.1:8222/healthz

      - name: Verify JetStream is enabled
        if: ${{ inputs.use_nats && inputs.use_nats_jetstream }}
        run: |
          JS_INFO=$(curl --fail --silent --retry 5 --retry-delay 1 http://127.0.0.1:8222/jsz)
          echo "JetStream info: $JS_INFO"
          if echo "$JS_INFO" | grep -q '"disabled"'; then
            echo "JetStream failed to start"; exit 1
          fi
          echo "JetStream is operational"

      # --- Optional: NATS via in-cluster port-forward ---
      # Use when tests require in-cluster NATS state (e.g. shared streams, TLS, NKey auth).
      # Adds /etc/hosts entry so TLS cert verification passes (cert SAN = nats.nats.svc).
      - name: Get GKE credentials for NATS tunnel
        if: ${{ inputs.use_nats_port_forward }}
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.CLUSTER_NAME }}
          location: ${{ secrets.CLUSTER_REGION }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Port-forward NATS via in-cluster service
        if: ${{ inputs.use_nats_port_forward }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends netcat-openbsd
          # Add hosts entry so TLS server name matches the cert SAN
          echo "127.0.0.1 nats.nats.svc" | sudo tee -a /etc/hosts
          nohup kubectl port-forward -n nats svc/nats \
            "$NATS_PORT":4222 \
            > nats-pf.out 2> nats-pf.err < /dev/null &
          echo "NATS_PORT_FORWARD_PID=$!" >> $GITHUB_ENV
          # Wait for the local listener
          for i in $(seq 1 15); do
            if nc -z 127.0.0.1 "$NATS_PORT"; then
              echo "NATS tunnel up"
              exit 0
            fi
            sleep 2
          done
          echo "NATS port-forward did not come up"; cat nats-pf.err; exit 1

      - name: Wait for NATS to be reachable
        if: ${{ inputs.use_nats_port_forward }}
        run: |
          wait_time=5
          max_attempts=3
          for i in $(seq 1 $max_attempts); do
            if nc -zv nats.nats.svc "$NATS_PORT"; then
              echo "NATS server is reachable!"
              echo "NATS_URL=tls://nats.nats.svc:$NATS_PORT" >> $GITHUB_ENV
              exit 0
            fi
            echo "Attempt $i failed. Waiting ${wait_time}s..."
            sleep $wait_time
            wait_time=$((wait_time * 2))
          done
          echo "NATS server did not become reachable in time"
          exit 1

      # --- Optional: Vault ---
      # Unlike NATS and Cloud SQL, Vault needs NO port-forward: runners are ARC
      # pods inside the cluster, so https://vault.vault.svc:8200 resolves and is
      # reachable directly (no NetworkPolicies restrict it). The caller's
      # VAULT_ADDR is therefore already correct as-is.
      #
      # What is missing on a runner is the credential. common/vault authenticates
      # ONLY via Kubernetes auth (kubeauth.NewKubernetesAuth), reading a projected
      # ServiceAccount token from a file. A runner pod has no projected token for
      # the service under test, so the login has nothing to present and the client
      # fails to build. We mint that token here with `kubectl create token` against
      # the service's real KSA, which is exactly what Vault's role is bound to.
      #
      # The token is audience-scoped to "vault", matching the projected token
      # volume in modules/kubernetes and the role's bound audience. It cannot be
      # replayed against the Kubernetes API server.
      - name: Get GKE credentials for Vault
        if: ${{ inputs.use_vault }}
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.CLUSTER_NAME }}
          location: ${{ secrets.CLUSTER_REGION }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Mint Vault ServiceAccount token
        if: ${{ inputs.use_vault }}
        env:
          VAULT_KSA: ${{ inputs.vault_ksa }}
          VAULT_KSA_NAMESPACE: ${{ inputs.vault_ksa_namespace }}
        run: |
          set -euo pipefail

          if [ -z "$VAULT_KSA" ]; then
            echo "use_vault=true requires vault_ksa"; exit 1
          fi
          # Convention: KSA <service>-ksa lives in namespace <service>.
          ns="${VAULT_KSA_NAMESPACE:-${VAULT_KSA%-ksa}}"

          kubectl get secret vault-tls -n vault -o jsonpath='{.data.ca\.crt}' \
            | base64 -d > /tmp/vault-ca.crt
          if [ ! -s /tmp/vault-ca.crt ]; then
            echo "Vault CA bundle came back empty"; exit 1
          fi

          # Duration must outlast the job: common/vault's renewal goroutine
          # re-reads this file, and a static file never rotates. Failing the job
          # is better than a token expiring mid-test and surfacing as an
          # unrelated 502 from whichever call needed a secret next.
          kubectl create token "$VAULT_KSA" \
            --namespace "$ns" \
            --audience vault \
            --duration 7200s > /tmp/vault-token
          chmod 600 /tmp/vault-token

          echo "VAULT_CACERT=/tmp/vault-ca.crt"    >> $GITHUB_ENV
          echo "VAULT_TOKEN_PATH=/tmp/vault-token" >> $GITHUB_ENV
          echo "Minted Vault token for $ns/$VAULT_KSA"

      # --- Go private module access ---
      - name: Set up Go environment for private repo access
        run: |
          git config --global url."https://$GH_ACCESS_TOKEN@github.com/".insteadOf "https://github.com/"
        env:
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Download Go Modules
        if: ${{ inputs.multi_service == '' }}
        run: go mod download
        working-directory: ${{ inputs.working_directory }}
        env:
          GOPRIVATE: github.com/wanaware

      - name: Run Go Mod Tidy
        if: ${{ inputs.multi_service == '' }}
        run: go mod tidy
        working-directory: ${{ inputs.working_directory }}
        env:
          GOPRIVATE: github.com/wanaware

      # --- Optional: Cloud SQL via in-cluster proxy (private-IP instance) ---
      # Cloud SQL is private-IP only (ISO 27001:2022 A.8.24 hardening), so a
      # GitHub-hosted runner has no route to the instance. Tunnel to the
      # in-cluster cloud-sql-proxy (deploy postgres-client, svc
      # cloudsql-proxy-service:5432 in ns tunnel) via kubectl port-forward,
      # reusing the same GCP_SERVICE_ACCOUNT / GKE-auth pattern deployment.yaml
      # uses for kubectl rollout restart.
      - name: Get GKE credentials for DB tunnel
        if: ${{ inputs.use_cloud_sql }}
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.CLUSTER_NAME }}
          location: ${{ secrets.CLUSTER_REGION }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Port-forward Cloud SQL via in-cluster proxy
        if: ${{ inputs.use_cloud_sql }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends netcat-openbsd
          nohup kubectl port-forward -n tunnel svc/cloudsql-proxy-service \
            "$DB_PORT":5432 \
            > pf.out 2> pf.err < /dev/null &
          echo "PORT_FORWARD_PID=$!" >> $GITHUB_ENV
          # Wait for the local listener, tolerating proxy pod cold-start.
          for i in $(seq 1 15); do
            if nc -z 127.0.0.1 "$DB_PORT"; then echo "tunnel up"; exit 0; fi
            sleep 2
          done
          echo "port-forward did not come up"; cat pf.err; exit 1

      - name: Wait for DB server to be reachable
        if: ${{ inputs.use_cloud_sql }}
        run: |
          wait_time=5
          max_attempts=3
          for i in $(seq 1 $max_attempts); do
            if nc -zv localhost "$DB_PORT"; then
              echo "DB server is reachable!"
              exit 0
            fi
            echo "Attempt $i failed. Waiting ${wait_time}s..."
            sleep $wait_time
            wait_time=$((wait_time * 2))
          done
          echo "DB server did not become reachable in time"
          exit 1

      - name: Install pg client
        if: ${{ inputs.use_cloud_sql }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client netcat-openbsd

      - name: Connect to cloud-sql-proxy using PG client
        if: ${{ inputs.use_cloud_sql }}
        run: |
          PGPASSWORD="$DB_PASSWORD" psql \
            -h 127.0.0.1 \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -c 'SELECT NOW()' 2>&1

      # --- Build and start Go server ---
      - name: Authenticate to GCP as Application SA
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ inputs.ci_app_runtime_sa_email != '' && inputs.ci_app_runtime_sa_email || secrets.CI_APP_RUNTIME_SA_EMAIL }}
          create_credentials_file: true

      # --- Multi-service manifest mode ---
      - name: Download Go modules for all services
        if: ${{ inputs.multi_service != '' }}
        run: |
          for svc_dir in services/*/; do
            if [ -f "$svc_dir/go.mod" ]; then
              echo "Downloading modules for $svc_dir..."
              (cd "$svc_dir" && go mod download)
            fi
          done
        env:
          GOPRIVATE: github.com/wanaware

      - name: Start services from manifest
        if: ${{ inputs.multi_service != '' }}
        run: |
          chmod +x "$MULTI_SERVICE"
          "$MULTI_SERVICE"
        env:
          MULTI_SERVICE: ${{ inputs.multi_service }}

      # --- Single-server mode ---
      - name: Build Go server
        if: ${{ inputs.multi_service == '' && inputs.server_cmd != '' }}
        run: go build -o /tmp/server-binary ${{ inputs.server_cmd }}
        working-directory: ${{ inputs.working_directory }}
        env:
          GOPRIVATE: github.com/wanaware

      - name: Start Go server
        if: ${{ inputs.multi_service == '' }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          chmod +x ${{ inputs.wait_for_it_path }}
          # Write extra server env vars to a temp file and source it
          if [ -n "$SERVER_ENV" ]; then
            echo "$SERVER_ENV" > /tmp/server_extra.env
            set -a && source /tmp/server_extra.env && set +a
          fi
          nohup /tmp/server-binary >> server.log 2>&1 & echo $! > server_pid.txt
          API_PID=$(cat server_pid.txt)
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          echo "Server started with PID: $API_PID"
        # Everything the server needs — DB_PASSWORD, NEO4J_*, AUTHENTICATION_KEY,
        # the GraphQL endpoints, NEW_RELIC_*, and the rest — is already in this
        # pod's environment from Keeper, and the binary inherits it. Of the three
        # entries below, only DB_HOST is configuration, and it is rig-specific:
        # the server reaches the database through the local port-forward, not the
        # cluster address Keeper holds. SERVER_ENV is the caller's own override
        # block and GOPRIVATE is build tooling. Adding an application key back
        # here would shadow the Keeper value for this step.
        env:
          SERVER_ENV: ${{ inputs.server_env }}
          GOPRIVATE: github.com/wanaware
          DB_HOST: "127.0.0.1"

      - name: Wait for API server to be reachable
        if: ${{ inputs.multi_service == '' }}
        run: |
          wait_time=5
          max_attempts=6
          for i in $(seq 1 $max_attempts); do
            if curl --silent --head http://localhost:8080/ || curl --silent --head http://localhost:8080/graphql; then
              echo "API server is reachable!"
              exit 0
            fi
            echo "Attempt $i failed. Waiting ${wait_time}s..."
            sleep $wait_time
            wait_time=$((wait_time * 2))
          done
          echo "API server did not become reachable in time"
          cat server.log
          exit 1

      # --- Newman tests ---
      - name: Install Newman
        run: npm install -g newman

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"

      - name: Install pip and dependencies
        working-directory: ${{ inputs.working_directory }}
        run: |
          python -m pip install --upgrade pip
          pip install requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- Optional: Neo4j/DB cleanup before tests ---
      - name: Clean up Neo4j test data before tests
        if: ${{ inputs.cleanup_script != '' }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          chmod +x ${{ inputs.cleanup_script }}
          ${{ inputs.cleanup_script }}
        # As above: NEO4J_* and DB_* come from the pod environment; only the
        # local-tunnel host is specific to the rig.
        env:
          DB_HOST: "127.0.0.1"

      # --- Option 1: Use pre_test_setup_script (like create_and_capture_ids.py) ---
      - name: Run Python Script to Get Access Token and Function IDs
        if: ${{ inputs.pre_test_setup_script != '' }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          result=$(python ${{ inputs.pre_test_setup_script }})
          SCRIPT_EXIT_CODE=$?
          echo "$result"
          if [ $SCRIPT_EXIT_CODE -ne 0 ]; then
            echo "ERROR: Pre-test setup script failed with exit code $SCRIPT_EXIT_CODE"
            exit 1
          fi

          ACCESS_TOKEN=$(echo "$result" | grep "Access Token" | sed 's/Access Token: //')
          FUNCTION_IDS=$(echo "$result" | grep "Function IDs" | sed 's/Function IDs: //')
          CUSTOMER_ID=$(echo "$result" | grep "Customer ID" | sed 's/Customer ID: //')

          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo "ERROR: ACCESS_TOKEN is missing!"
            exit 1
          fi

          echo "ACCESS_TOKEN=${ACCESS_TOKEN}" >> $GITHUB_ENV
          echo "CUSTOMER_ID=${CUSTOMER_ID}" >> $GITHUB_ENV
          if [[ -n "$FUNCTION_IDS" ]] && [[ "$FUNCTION_IDS" != "[]" ]]; then
            echo "FUNCTION_IDS=${FUNCTION_IDS}" >> $GITHUB_ENV
          fi

      # --- Option 2: Use simple access_token_script ---
      - name: Fetch access token and build Newman env
        if: ${{ !inputs.skip_access_token && inputs.pre_test_setup_script == '' }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          OUTPUT=$(python3 ${{ inputs.access_token_script }})
          ACCESS_TOKEN=$(echo "$OUTPUT" | grep "Access Token:" | awk -F': ' '{print $2}')
          CUSTOMER_ID=$(echo "$OUTPUT" | grep "Customer ID:" | awk -F': ' '{print $2}')

          if [ -z "$ACCESS_TOKEN" ] || [ -z "$CUSTOMER_ID" ]; then
            echo "Failed to fetch ACCESS_TOKEN or CUSTOMER_ID"
            exit 1
          fi

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          echo "CUSTOMER_ID=$CUSTOMER_ID" >> $GITHUB_ENV

      - name: Build Newman environment JSON
        # if: ${{ inputs.test_runner_script == '' }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          # Build base Newman env JSON
          BASE_ENV=$(jq -n \
            --arg baseUrl "http://localhost:8080" \
            --arg accessToken "$ACCESS_TOKEN" \
            --arg customerId "$CUSTOMER_ID" \
            '{
              "id": "integration-test-env",
              "name": "Integration Test Environment",
              "values": [
                {"key": "baseUrl", "value": $baseUrl, "enabled": true},
                {"key": "ACCESS_TOKEN", "value": $accessToken, "enabled": true},
                {"key": "CUSTOMER_ID", "value": $customerId, "enabled": true}
              ]
            }')

          # Merge with any extra env vars passed via input
          if [ -n "$NEWMAN_ENV_JSON" ]; then
            echo "$BASE_ENV" | jq --argjson extra "$NEWMAN_ENV_JSON" \
              '.values += $extra' > newman_env.json
          else
            echo "$BASE_ENV" > newman_env.json
          fi
        env:
          NEWMAN_ENV_JSON: ${{ inputs.newman_env_json }}

      # --- Optional: Delete data tags before tests ---
      - name: Delete previously created data tags
        if: ${{ inputs.delete_data_tags_script != '' }}
        working-directory: ${{ inputs.working_directory }}
        run: python ${{ inputs.delete_data_tags_script }} "$ACCESS_TOKEN"

      # --- Option 1: Custom test runner script ---
      - name: Run Integration Tests (custom runner)
        if: ${{ inputs.test_runner_script != '' }}
        id: custom_runner
        continue-on-error: true
        working-directory: ${{ inputs.working_directory }}
        run: |
          ${{ inputs.wait_for_it_path }} -t 60 127.0.0.1:8080 && echo "Server is ready"
          chmod +x ${{ inputs.test_runner_script }}
          ${{ inputs.test_runner_script }} "$ACCESS_TOKEN" "$FUNCTION_IDS" "$CUSTOMER_ID"

      # --- Option 2: Direct Newman run ---
      - name: Run Integration Tests (newman)
        if: ${{ inputs.test_runner_script == '' }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          ${{ inputs.wait_for_it_path }} -t 60 127.0.0.1:8080 && echo "Server is ready"
          echo "NEWMAN_FAILED=false" >> $GITHUB_ENV

          if ! newman run ${{ inputs.postman_collection }} \
            -e newman_env.json \
            ${{ inputs.newman_extra_args }} \
            --reporters cli,json \
            --reporter-json-export newman-results.json; then
            echo "NEWMAN_FAILED=true" >> $GITHUB_ENV
          fi

      - name: Comment Integration Test Results on PR
        if: ${{ always() && inputs.test_runner_script == '' }}
        run: |
          echo '### Integration Test Results' > comment_integration_tests.md
          if [ "$NEWMAN_FAILED" == "true" ]; then
            echo '**❌ Integration tests failed**' >> comment_integration_tests.md
            echo '' >> comment_integration_tests.md
            echo "Collection: \`${{ inputs.postman_collection }}\`" >> comment_integration_tests.md
          else
            echo '**✅ All integration tests passed successfully!**' >> comment_integration_tests.md
            echo '' >> comment_integration_tests.md
            echo "Collection: \`${{ inputs.postman_collection }}\`" >> comment_integration_tests.md
          fi
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment_integration_tests.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Optional: Post-test cleanup (e.g. delete_nodes.py) ---
      - name: Delete previously created node ids
        if: ${{ always() && inputs.post_test_cleanup_script != '' }}
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [[ -n "$FUNCTION_IDS" ]]; then
            FUNCTION_IDS_STRING=$(echo "$FUNCTION_IDS" | jq -r '. | join(",")')
            python ${{ inputs.post_test_cleanup_script }} "$ACCESS_TOKEN" "${{ inputs.post_test_cleanup_args }}" "$FUNCTION_IDS_STRING"
          fi

      # The server writes startup diagnostics to server.log. Without this the log
      # is discarded with the runner, so a config problem at boot (a dependency
      # client that failed to initialise, say) is invisible and only shows up as
      # an unexplained error from whichever request needed it later.
      - name: Dump server log on failure
        if: failure()
        run: |
          for f in server.log services/*/server.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 200 "$f"
            echo "::endgroup::"
          done

      - name: Close App Server & DB tunnel
        if: always()
        run: |
          [ -n "${API_PID:-}" ] && kill $API_PID || true
          [ -n "${PORT_FORWARD_PID:-}" ] && kill $PORT_FORWARD_PID || true
          [ -n "${NATS_SERVER_PID:-}" ] && kill $NATS_SERVER_PID || true
          [ -n "${NATS_PORT_FORWARD_PID:-}" ] && kill $NATS_PORT_FORWARD_PID || true

      - name: Stop services from manifest
        if: ${{ always() && inputs.multi_service != '' }}
        run: |
          if [ -f /tmp/service-pids.txt ]; then
            awk '{print $NF}' /tmp/service-pids.txt | xargs -r kill 2>/dev/null || true
          fi

      - name: Check for Failed Integration Tests
        run: |
          # Check for direct newman failure
          if [ "$NEWMAN_FAILED" == "true" ]; then
            echo "Integration tests failed."
            exit 1
          fi
          # Check for custom runner failure (step outcome)
          if [ "${{ steps.custom_runner.outcome }}" == "failure" ]; then
            echo "Integration tests failed (custom runner)."
            exit 1
          fi
          echo "All integration tests passed."
