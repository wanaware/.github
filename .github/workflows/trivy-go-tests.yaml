name: Trivy Scan and Go Tests

on:
  workflow_call:
    inputs:
      run_go_tests:
        description: 'Enable Go module download and tests (set to true for Go repos)'
        required: false
        default: false
        type: boolean
      working_directory:
        description: 'Working directory for Go commands (default: root)'
        required: false
        default: '.'
        type: string
      test_path:
        description: 'Path to test directory relative to working_directory (default: ./tests/...)'
        required: false
        default: './tests/...'
        type: string
  pull_request:
    branches:
      - dev
      - stage
      - prod

permissions:
  contents: read

jobs:
  trivy-scan-and-test:
    name: Run Trivy Scan and Go Tests
    # In-house ARC. PR-time checks aren't tied to an env yet, so they run on the dev cluster's
    # runners (arc-shared-dev). Nothing runs on GitHub-hosted runners.
    runs-on: arc-shared-dev
    environment: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go environment for private repo access
        if: ${{ inputs.run_go_tests }}
        run: |
          git config --global url."https://$GH_ACCESS_TOKEN@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/wanaware/*

      - name: Download Go Modules
        if: ${{ inputs.run_go_tests }}
        working-directory: ${{ inputs.working_directory }}
        run: go mod download

      - name: Run Go Mod Tidy
        if: ${{ inputs.run_go_tests }}
        working-directory: ${{ inputs.working_directory }}
        run: go mod tidy

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          version: 'v0.76.2'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '1'

      - name: Run Go Unit Tests
        if: ${{ inputs.run_go_tests }}
        working-directory: ${{ inputs.working_directory }}
        run: go test -v ${{ inputs.test_path }}
